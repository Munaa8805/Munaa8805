<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Munaa Tsetsegmaa — Full-Stack Developer</title>
  <desc id="d">Banner: Full-stack web and mobile developer based in Calgary, Canada.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="1" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 78px 232px; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow2)"/>

  <!-- Left: identity -->
  <text x="64" y="92" class="mono" font-size="16" fill="#2dd4bf" letter-spacing="2">HELLO, WORLD — I'M</text>
  <text x="62" y="150" class="sans" font-size="54" font-weight="700" fill="#f0f6fc">Munaa Tsetsegmaa</text>
  <rect x="64" y="170" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="208" class="sans" font-size="22" fill="#c9d1d9">Full-Stack Developer · Web &amp; Mobile</text>
  <circle class="pulse" cx="78" cy="242" r="5" fill="#2dd4bf"/>
  <text x="92" y="248" class="sans" font-size="16" fill="#8b949e">Calgary, AB, Canada · Open to opportunities</text>

  <!-- Right: code window -->
  <g transform="translate(720 52)">
    <rect width="420" height="216" rx="12" fill="#0b0f14" stroke="#30363d"/>
    <circle cx="22" cy="20" r="5" fill="#ff5f57"/>
    <circle cx="40" cy="20" r="5" fill="#febc2e"/>
    <circle cx="58" cy="20" r="5" fill="#28c840"/>
    <text x="210" y="24" text-anchor="middle" class="mono" font-size="12" fill="#6e7681">munaa.ts</text>
    <line x1="0" y1="38" x2="420" y2="38" stroke="#21262d"/>
    <g class="mono" font-size="14">
      <text x="22" y="68"><tspan fill="#ff7b72">const</tspan><tspan fill="#d2a8ff"> munaa</tspan><tspan fill="#c9d1d9"> = {</tspan></text>
      <text x="42" y="94"><tspan fill="#79c0ff">web</tspan><tspan fill="#c9d1d9">: [</tspan><tspan fill="#a5d6ff">"React"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"Next.js"</tspan><tspan fill="#c9d1d9">],</tspan></text>
      <text x="42" y="120"><tspan fill="#79c0ff">api</tspan><tspan fill="#c9d1d9">: [</tspan><tspan fill="#a5d6ff">"Node"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"Express"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"Laravel"</tspan><tspan fill="#c9d1d9">],</tspan></text>
      <text x="42" y="146"><tspan fill="#79c0ff">mobile</tspan><tspan fill="#c9d1d9">: [</tspan><tspan fill="#a5d6ff">"React Native"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"Flutter"</tspan><tspan fill="#c9d1d9">],</tspan></text>
      <text x="42" y="172"><tspan fill="#79c0ff">data</tspan><tspan fill="#c9d1d9">: [</tspan><tspan fill="#a5d6ff">"MongoDB"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"PostgreSQL"</tspan><tspan fill="#c9d1d9">],</tspan></text>
      <text x="22" y="198"><tspan fill="#c9d1d9">};</tspan><tspan class="cursor" fill="#2dd4bf"> ▍</tspan></text>
    </g>
  </g>
</svg>
